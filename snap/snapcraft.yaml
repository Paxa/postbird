name: postbird
base: core24
version: '0.9.2'
summary: PostgreSQL GUI client
description: |
  Postbird is a cross-platform PostgreSQL GUI client, written in TypeScript, powered by Electrobun.
grade: stable
confinement: strict

apps:
  postbird:
    command: opt/postbird/bin/launcher
    desktop: usr/share/applications/postbird.desktop
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - removable-media

parts:
  postbird:
    plugin: dump
    source: postbird.deb
    source-type: deb

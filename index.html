<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Postbird</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="public/codemirror/codemirror.css" media="all" rel="stylesheet" type="text/css" />
    <link href="public/codemirror/addon/dialog/dialog.css" media="all" rel="stylesheet" type="text/css">
    <link href="public/codemirror/addon/hint/show-hint.css" media="all" rel="stylesheet" type="text/css" />
    <link href="public/style.css" media="all" rel="stylesheet" type="text/css" />
  </head>
  <body class="platform-darwin" spellcheck="false">
    <script>
      window.onerror = function(msg, url, line, col, error) {
        console.error("[Postbird Error]", msg, "at line", line, error);
        if (window.__postbirdRpc && window.__postbirdRpc.logDevError) {
          window.__postbirdRpc.logDevError({
            type: "WINDOW_ERROR",
            message: String(msg) + (url ? " at " + url + ":" + line + ":" + col : ""),
            stack: error ? error.stack : undefined,
          }).catch(function() {});
        }
      };

      window.addEventListener("unhandledrejection", function(event) {
        var reason = event.reason || "Unhandled Promise Rejection";
        console.error("[Postbird Unhandled Rejection]", reason);
        if (window.__postbirdRpc && window.__postbirdRpc.logDevError) {
          window.__postbirdRpc.logDevError({
            type: "UNHANDLED_PROMISE_REJECTION",
            message: reason && reason.message ? reason.message : String(reason),
            stack: reason && reason.stack ? reason.stack : undefined,
          }).catch(function() {});
        }
      });
    </script>

    <div id="tabs"></div>
    <div id="content"></div>

    <!-- Electrobun RPC and view bridge -->
    <script type="text/javascript" src="index.js"></script>

    <!-- UI libraries -->
    <script type="text/javascript" src="public/jquery.js"></script>

      window.$ = window.jQuery;

    <script type="text/javascript" src="public/codemirror/javascript/javascript.js"></script>
    <script type="text/javascript" src="public/codemirror/addon/dialog/dialog.js"></script>
    <script type="text/javascript" src="public/codemirror/addon/search/searchcursor.js"></script>

name: Build

on:
  push:
    branches:
      - master
      - feature/*
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-latest
            artifact-name: Postbird-macos-arm64
          - target: windows-x64
            os: windows-latest
            artifact-name: Postbird-windows-x64
          - target: linux-x64
            os: ubuntu-latest
            artifact-name: Postbird-linux-x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            artifact-name: Postbird-linux-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev ruby ruby-dev rubygems rpm file || sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev ruby ruby-dev rubygems rpm file
          sudo gem install --no-document fpm || true
          ARCH_NAME="x86_64"
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then ARCH_NAME="aarch64"; fi
          case "${ARCH_NAME}" in
            x86_64) APPIMAGETOOL_SHA256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 ;;
            aarch64) APPIMAGETOOL_SHA256=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158 ;;
          esac
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${ARCH_NAME}.AppImage" -o /tmp/appimagetool
          echo "$APPIMAGETOOL_SHA256  /tmp/appimagetool" | sha256sum -c -
          chmod +x /tmp/appimagetool

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build distribution package
        run: bun run dist

      - name: Package Linux formats (deb, rpm, AppImage)
        if: runner.os == 'Linux'
        run: bash scripts/package_linux.sh ${{ matrix.target }}

      - name: Stage .deb for the snap build
        if: runner.os == 'Linux'
        run: cp "artifacts/Postbird-${{ matrix.target }}.deb" postbird.deb

      - name: Build snap
        if: runner.os == 'Linux'
        id: snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0

      - name: Move snap into artifacts
        if: runner.os == 'Linux'
        run: mv "${{ steps.snap.outputs.snap }}" "artifacts/Postbird-${{ matrix.target }}.snap"

      - name: Prepare distribution artifacts
        shell: bash
        run: |
          # Remove auto-updater archives to keep distributions lean
          rm -f artifacts/*.tar.zst artifacts/*update.json

          # Normalize macOS dmg name
          if [ "${{ runner.os }}" = "macOS" ]; then
            for dmg in artifacts/*Postbird*.dmg; do
              if [ -f "$dmg" ] && [ "$dmg" != "artifacts/${{ matrix.artifact-name }}.dmg" ]; then
                mv "$dmg" "artifacts/${{ matrix.artifact-name }}.dmg"
              fi
            done
          fi

          # Normalize Windows zip name
          if [ "${{ runner.os }}" = "Windows" ]; then
            for winzip in artifacts/*Postbird*.zip; do
              if [ -f "$winzip" ] && [ "$winzip" != "artifacts/${{ matrix.artifact-name }}.zip" ]; then
                mv "$winzip" "artifacts/${{ matrix.artifact-name }}.zip"
              fi
            done
          fi

      - name: List built artifacts
        shell: bash
        run: ls -lah artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/*

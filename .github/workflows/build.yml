name: Build and Release

on:
  push:
    branches:
      - master
      - feature/*
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-latest
            artifact-name: Postbird-macos-arm64
          - target: macos-x64
            os: macos-13
            artifact-name: Postbird-macos-x64
          - target: windows-x64
            os: windows-latest
            artifact-name: Postbird-windows-x64
          - target: linux-x64
            os: ubuntu-latest
            artifact-name: Postbird-linux-x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            artifact-name: Postbird-linux-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build distribution package
        run: bun run dist

      - name: List built artifacts
        shell: bash
        run: ls -lah artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/*

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
